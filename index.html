
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgeGUI Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; }
        .glass-input { background: rgba(25, 25, 30, 0.7); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Mensagem Principal -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold tracking-tight">Type an idea to<br>start creating</h1>
    </div>

    <!-- Container do Prompt (Idêntico ao da imagem) -->
    <div class="w-full max-w-lg glass-input p-4 rounded-3xl shadow-2xl">
        <textarea id="prompt" placeholder="What do you want to generate?" 
            class="w-full bg-transparent p-2 h-24 resize-none outline-none text-slate-300"></textarea>
        
        <div class="flex items-center justify-between mt-2">
            <div class="flex gap-2">
                <button class="p-3 bg-white/5 rounded-full hover:bg-white/10">🖼️</button>
                <button class="p-3 bg-white/5 rounded-full hover:bg-white/10">✨</button>
                <button class="p-3 bg-white/5 rounded-full hover:bg-white/10">code</button>
            </div>
            <button onclick="enviar()" class="p-4 bg-blue-600 rounded-full hover:bg-blue-500 transition">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        async function enviar() {
            let key = localStorage.getItem('my_key');
            if(!key) {
                key = prompt("Como você não quer chave no código, cole sua API Key aqui só uma vez (o navegador vai salvar pra você):");
                if(key) localStorage.setItem('my_key', key);
                else return;
            }
            
            const p = document.getElementById('prompt').value;
            if(!p) return alert("Escreva o que você quer gerar!");

            alert("Conectando com IA usando sua chave salva... Gerando: " + p);
            // Aqui entra a lógica da chamada da API usando a 'key' salva no localStorage
        }
    </script>
</body>
</html>
