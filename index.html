<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>VortexDev — IA Generativa de Projetos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glow-button { box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4); }
        .text-gradient { background: linear-gradient(135deg, #A78BFA 0%, #22D3EE 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-[#030712] text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-2xl w-full text-center">
        <h1 class="text-6xl font-extrabold mb-6">Construa softwares <br/><span class="text-gradient">na velocidade do pensamento.</span></h1>
        <p class="text-slate-400 mb-10">Descreva seu projeto completo e o VortexDev gera a arquitetura para você.</p>
        
        <div class="bg-[#0B0F19] p-4 rounded-3xl border border-[#1E293B] shadow-2xl">
            <textarea id="promptArea" class="w-full bg-transparent p-4 outline-none h-32" placeholder="Ex: Crie um site de portfólio moderno..."></textarea>
            <button onclick="irParaWorkspace()" class="w-full bg-gradient-to-r from-purple-600 to-cyan-500 py-4 rounded-xl font-bold hover:scale-[1.01] transition-all">
                Gerar Projeto Vortex
            </button>
        </div>
    </div>

    <script>
        function irParaWorkspace() {
            const prompt = document.getElementById('promptArea').value;
            if(!prompt) return alert("Digite algo!");
            localStorage.setItem('userPrompt', prompt);
            window.location.href = 'workspace.html';
        }
    </script>
</body>
</html>
