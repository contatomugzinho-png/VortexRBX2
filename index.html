<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Roblox Thumbnail & GUI Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Biblioteca para exportar a thumbnail como imagem PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .font-teko { font-family: 'Teko', sans-serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .roblox-gui {
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-poppins min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Título -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 font-teko tracking-wider text-5xl">
                ROBLOX AI THUMBNAIL & GUI GENERATOR
            </h1>
            <p class="text-slate-400 text-sm">Digite sua ideia e a IA criará a Force GUI e o visual de Roblox para você!</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Painel de Prompt e IA -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-xl font-bold text-blue-400 border-b border-slate-800 pb-2">🤖 Prompt da IA</h2>
                
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Chave da API Gemini</label>
                    <input type="password" id="apiKey" placeholder="Cole sua chave Gemini API aqui" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-xs focus:outline-none focus:border-blue-500">
                    <p class="text-[10px] text-slate-500 mt-1">Necessário para a IA gerar o conteúdo via prompt.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">O que você quer na Thumbnail?</label>
                    <textarea id="aiPrompt" rows="4" placeholder="Ex: Um painel hacker ultra poderoso para Blox Fruits com tema vermelho escuro..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-blue-500 resize-none">Um script supremo para Blox Fruits com auto farm e tema azul neon</textarea>
                </div>

                <button onclick="generateWithAI()" id="btnGenerate" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 font-bold py-3 rounded-lg transition shadow-lg shadow-blue-600/30 flex items-center justify-center space-x-2">
                    <span>✨ Gerar com IA</span>
                </button>

                <button onclick="downloadThumbnail()" class="w-full bg-slate-800 hover:bg-slate-700 font-bold py-2.5 rounded-lg transition text-xs border border-slate-700">
                    📥 Baixar Thumbnail (PNG)
                </button>
            </div>

            <!-- Área de Visualização (Thumbnail Preview) -->
            <div class="lg:col-span-2 flex flex-col items-center justify-center bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h2 class="text-xl font-bold text-slate-300 mb-4 self-start">🖼️ Prévia da Thumbnail</h2>
                
                <!-- Canvas / Display da Thumbnail (Proporção 16:9 ideal para Roblox) -->
                <div id="thumbnailCanvas" class="relative w-full aspect-video rounded-xl overflow-hidden flex items-center justify-center bg-cover bg-center border border-slate-700" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000&auto=format&fit=crop');">
                    
                    <!-- Overlay escuro para destacar a GUI -->
                    <div class="absolute inset-0 bg-black/60"></div>

                    <!-- Janela da GUI simulada -->
                    <div id="guiWindow" class="roblox-gui relative z-10 w-3/4 max-w-md rounded-lg overflow-hidden border-2 border-blue-500 shadow-2xl">
                        <!-- Barra Superior da GUI -->
                        <div class="bg-slate-900 px-4 py-2 flex justify-between items-center border-b border-slate-800">
                            <div class="flex items-center space-x-2">
                                <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                                <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                                <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                                <span id="previewSubtitle" class="text-xs text-slate-400 font-mono ml-2">BLOX FRUITS V1</span>
                            </div>
                            <span class="text-xs text-slate-500 font-bold">ROBLOX GUI</span>
                        </div>

                        <!-- Corpo da GUI -->
                        <div class="p-6 text-center space-y-4">
                            <h3 id="previewTitle" class="text-4xl font-teko tracking-wider text-white drop-shadow-md">SUPREME HUB</h3>
                            
                            <!-- Botões falsos simulando funcionalidades -->
                            <div class="grid grid-cols-2 gap-3">
                                <div id="btnFeature1" class="bg-blue-600/80 hover:bg-blue-500 py-2 rounded text-xs font-bold border border-blue-400/50 cursor-pointer transition">
                                    AUTO FARM: ON
                                </div>
                                <div id="btnFeature2" class="bg-slate-800 hover:bg-slate-700 py-2 rounded text-xs font-bold border border-slate-700 cursor-pointer transition">
                                    ESP PLAYERS
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <div id="statusMessage" class="text-xs text-slate-400 mt-3 text-center">Pronto para gerar via IA.</div>
            </div>

        </div>
    </div>

    <script>
        async function generateWithAI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const promptText = document.getElementById('aiPrompt').value.trim();
            const statusMsg = document.getElementById('statusMessage');
            const btn = document.getElementById('btnGenerate');

            if (!apiKey) {
                alert("Por favor, insira sua chave da API do Gemini.");
                return;
            }

            if (!promptText) {
                alert("Por favor, digite um prompt.");
                return;
            }

            btn.innerText = "Gerando...";
            statusMsg.innerText = "Conectando com a IA e criando o design...";

            // Instrução para a IA retornar estritamente um JSON estruturado para o layout
            const systemInstruction = "Você é um gerador de conteúdo para GUIs de Roblox. O usuário vai te dar um prompt. Você deve retornar APENAS um objeto JSON puro (sem markdown em volta, sem crases de código como ```json) contendo exatamente estas chaves: \n" +
                "{\n" +
                "  \"title\": \"Título principal curto em letras maiúsculas para a GUI (ex: SUPREME HUB)\",\n" +
                "  \"subtitle\": \"Subtítulo ou versão (ex: V3.2 - OP)\",\n" +
                "  \"feature1\": \"Texto do botão 1 (ex: AUTO FARM)\",\n" +
                "  \"feature2\": \"Texto do botão 2 (ex: GOD MODE)\",\n" +
                "  \"themeColor\": \"Escolha uma cor de tema entre: 'blue' (azul), 'red' (vermelho), 'green' (verde), 'purple' (roxo)\",\n" +
                "  \"bgKeyword\": \"Uma palavra-chave em inglês para buscar uma imagem de fundo no Unsplash (ex: neon gaming, dark cyber, roblox game world)\"\n" +
                "}";

            try {
                const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: systemInstruction + "\n\nPrompt do usuário: " + promptText }] }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let rawText = data.candidates[0].content.parts[0].text.trim();
                // Limpar eventuais crases de markdown se a IA insistir em colocar
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

                const aiData = JSON.parse(rawText);

                // Aplicar dados na tela
                document.getElementById('previewTitle').innerText = aiData.title;
                document.getElementById('previewSubtitle').innerText = aiData.subtitle;
                document.getElementById('btnFeature1').innerText = aiData.feature1;
                document.getElementById('btnFeature2').innerText = aiData.feature2;

                // Definir cores do tema com base na escolha da IA
                applyTheme(aiData.themeColor);

                // Buscar imagem de fundo dinâmica baseada na keyword da IA
                const bgUrl = `[https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1000&auto=format&fit=crop](https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1000&auto=format&fit=crop)`; // Imagem gamer padrão garantida
                document.getElementById('thumbnailCanvas').style.backgroundImage = `url('${bgUrl}')`;

                statusMsg.innerText = "✨ Thumbnail gerada com sucesso pela IA!";
            } catch (error) {
                console.error(error);
                statusMsg.innerText = "Erro ao gerar: " + error.message;
            } finally {
                btn.innerText = "✨ Gerar com IA";
            }
        }

        function applyTheme(color) {
            const guiWindow = document.getElementById('guiWindow');
            const btn1 = document.getElementById('btnFeature1');
            
            let borderClass = "border-blue-500 shadow-blue-500/50";
            let btnBg = "bg-blue-600/80 hover:bg-blue-500 border-blue-400/50";

            if (color === 'red') {
                borderClass = "border-red-500 shadow-red-500/50";
                btnBg = "bg-red-600/80 hover:bg-red-500 border-red-400/50";
            } else if (color === 'green') {
                borderClass = "border-green-500 shadow-green-500/50";
                btnBg = "bg-green-600/80 hover:bg-green-500 border-green-400/50";
            } else if (color === 'purple') {
                borderClass = "border-purple-500 shadow-purple-500/50";
                btnBg = "bg-purple-600/80 hover:bg-purple-500 border-purple-400/50";
            }

            guiWindow.className = `roblox-gui relative z-10 w-3/4 max-w-md rounded-lg overflow-hidden border-2 shadow-2xl ${borderClass}`;
            btn1.className = `${btnBg} py-2 rounded text-xs font-bold border cursor-pointer transition text-white`;
        }

        function downloadThumbnail() {
            const canvasElement = document.getElementById('thumbnailCanvas');
            html2canvas(canvasElement, { useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'roblox-thumbnail.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
