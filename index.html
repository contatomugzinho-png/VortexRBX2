<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ForgeGUI Manual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #08080a; color: white; font-family: sans-serif; }
        .roblox-gui { background: #161622; border: 2px solid #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="p-6 flex flex-col items-center">

    <div class="w-full max-w-2xl bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-8">
        <h2 class="text-xl font-bold mb-4 text-blue-400">🛠️ Edição Manual (Sem API)</h2>
        <div class="grid grid-cols-2 gap-4">
            <input id="inTitle" type="text" placeholder="Título" class="bg-black p-2 rounded border border-slate-700" oninput="update()">
            <input id="inSub" type="text" placeholder="Subtítulo" class="bg-black p-2 rounded border border-slate-700" oninput="update()">
            <input id="inBtn1" type="text" placeholder="Botão 1" class="bg-black p-2 rounded border border-slate-700" oninput="update()">
            <input id="inBtn2" type="text" placeholder="Botão 2" class="bg-black p-2 rounded border border-slate-700" oninput="update()">
        </div>
    </div>

    <!-- Área da Thumbnail -->
    <div id="canvas" class="w-full max-w-md aspect-video bg-slate-800 rounded-xl flex items-center justify-center p-4">
        <div id="gui" class="roblox-gui w-full p-4 rounded-xl">
            <div class="flex justify-between mb-4">
                <div class="flex gap-1"><div class="w-3 h-3 bg-red-500 rounded-full"></div><div class="w-3 h-3 bg-yellow-500 rounded-full"></div></div>
                <span id="outSub" class="text-xs text-slate-400">V1.0</span>
            </div>
            <h1 id="outTitle" class="text-3xl font-bold text-center mb-4">TÍTULO</h1>
            <div class="grid grid-cols-2 gap-2">
                <button id="outBtn1" class="bg-blue-600 p-2 text-xs font-bold rounded">BOTÃO 1</button>
                <button id="outBtn2" class="bg-slate-700 p-2 text-xs font-bold rounded">BOTÃO 2</button>
            </div>
        </div>
    </div>

    <script>
        function update() {
            document.getElementById('outTitle').innerText = document.getElementById('inTitle').value || "TÍTULO";
            document.getElementById('outSub').innerText = document.getElementById('inSub').value || "V1.0";
            document.getElementById('outBtn1').innerText = document.getElementById('inBtn1').value || "BOTÃO 1";
            document.getElementById('outBtn2').innerText = document.getElementById('inBtn2').value || "BOTÃO 2";
        }
    </script>
</body>
</html>
