l <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Workspace | VortexDev</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 h-screen flex flex-col overflow-hidden">

    <header class="h-14 border-b border-slate-800 flex items-center justify-between px-6 bg-[#0B0F19]">
        <button onclick="window.location.href='index.html'" class="text-xs text-slate-400 hover:text-white">← Voltar para Nova Criação</button>
        <span class="font-bold text-white tracking-widest">VORTEX WORKSPACE</span>
        <button class="bg-indigo-600 px-4 py-1 rounded-lg text-sm font-bold">Download ZIP</button>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <aside class="w-64 bg-[#0B0F19] p-4 border-r border-slate-800">
            <div class="text-xs font-bold text-slate-500 mb-4 uppercase">Arquivos</div>
            <div id="fileList" class="space-y-2 text-sm text-slate-300"></div>
        </aside>

        <section class="flex-1 flex flex-col">
            <pre id="codeDisplay" class="flex-1 p-8 font-mono text-sm overflow-auto text-cyan-300 bg-black"></pre>
            
            <!-- Chat de Refinamento -->
            <div class="h-32 border-t border-slate-800 p-4 bg-[#0B0F19]">
                <input id="chatInput" type="text" class="w-full bg-slate-900 p-3 rounded-lg border border-slate-700 outline-none" placeholder="Peça uma modificação (Ex: Mude a cor do tema para escuro)...">
                <button onclick="refinarCodigo()" class="mt-2 text-xs text-indigo-400 hover:underline">Enviar modificação</button>
            </div>
        </section>
    </main>

    <script>
        const editor = document.getElementById('codeDisplay');
        
        function processarPedido() {
            const prompt = localStorage.getItem('userPrompt');
            editor.innerText = `// Gerando projeto: ${prompt}\n\n// Estrutura base criada...\nconsole.log("Projeto iniciado!");`;
            document.getElementById('fileList').innerHTML = "<div>📄 index.js</div><div>📄 style.css</div>";
        }

        function refinarCodigo() {
            const mod = document.getElementById('chatInput').value;
            if(!mod) return;
            editor.innerText += `\n\n// Aplicando modificação: ${mod}...\n// Código atualizado com sucesso.`;
            document.getElementById('chatInput').value = '';
        }

        processarPedido();
    </script>
</body>
</html>
